name: CI
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python tests and compilation
        run: |
          python -m compileall -q agent bin web tests
          python -m unittest discover -s tests -v
      - name: Frontend syntax
        run: |
          node --check web/static/app.js
          node --check web/static/ios-ui.js
          node --check web/static/cpu-details.js
          node --check web/static/sw.js
      - name: Device config template
        run: python -m json.tool config/devices.example.json > /dev/null
      - name: Ensure private runtime files stay out of Git
        run: |
          ! git ls-files | grep -E '(^config/devices\.json$|\.sqlite$|^data/|^\.venv/|\.pem$|\.key$|^\.env)'
